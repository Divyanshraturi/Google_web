
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="#">Gmail</a>
            <a href="#">Images</a>
            <div class="apps"></div>
            <button class="sign-in">Sign in</button>
        </nav>
    </header>

    <main>
        <div class="logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <form action="https://www.google.com/search" method="GET">
            <div class="search-box">
                <span>⌕</span>
                <input type="text" name="q" placeholder="Search Google or type a URL">
                
            </div>

            <div class="buttons">
                <button type="submit">Google Search</button>
                <button type="button" onclick="window.location.href='https://doodles.google/'">
                    I'm Feeling Lucky
                </button>
            </div>
        </form>
    </main>

    <footer>
        <div>India</div>
        <div class="footer-links">
            <div>
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
